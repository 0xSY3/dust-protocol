[profile.default]
src = "src"
out = "out"
script = "script"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
thanos_sepolia = "https://rpc.thanos-sepolia.tokamak.network"
whitechain_sepolia = "https://rpc.testnet.whitechain.io"
